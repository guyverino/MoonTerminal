[package]
name = "moon-ui-gpui"
version = "0.1.0"
edition = "2024"
description = "MoonTerminal GPUI-оболочка (миграция с egui). Поверх moon-core + gpui-component."

[[bin]]
name = "moon-gpui"
path = "src/main.rs"

[dependencies]
# Общий backend (config/session/market/metrics/...). UI-агностик.
moon-core = { path = "../moon-core" }
# wgpu-движок чарта (общий с egui-версией). Рендерим offscreen → readback → GPUI.
moon-chart = { path = "../moon-chart" }
wgpu = "22"
pollster = "0.3"
image = "0.25"

# GPUI (движок Zed) + палитра компонент (Longbridge). Оба с crates.io.
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"

anyhow = "1"
log = "0.4"
env_logger = "0.11"
# Сериализация раскладки доков (DockAreaState → docks.json рядом с exe).
serde_json = "1"

# Локальное смещение времени (подписи часов на шкале) — как в egui-оболочке.
# Только Windows; иначе UTC. moon-chart намеренно windows-free, поэтому tz здесь.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_SystemInformation"] }
