# Локализация интерфейса MoonTerminal. Формат rust-i18n `_version: 2`:
# каждый ключ → карта локаль→строка. Интерполяция: %{var}.
#
# Намеренно НЕ переводим (отраслевой стандарт / тех-метрики):
#   BUY · SELL · Cancel Buy · PANIC SELL · LONG · SHORT · ON · OFF
#   Size · SL · TS · VStop · Buy · Fill · Strat · Host · Port
#   строку метрик статус-бара (ticks/book/fps/present/CPU/RAM)
