# Верхняя панель, статус-бар, тулбар, откреплённое чарт-окно.
# Формат rust-i18n `_version: 2`: ключ → карта локаль→строка. Интерполяция: %{var}.
# Намеренно НЕ переводим: BUY · SELL · LONG · SHORT · ON · OFF · Live · строку метрик статус-бара.
_version: 2

# --- Shell (верхняя панель / статус) ---
# Глифы-иконки (⚙ ▶ ⏸ …) в словаре НЕ храним — они отдельным segment-ом в коде (см. README).
shell.settings_btn:
  ru: "Настройки"
  en: "Settings"
  es: "Ajustes"
status.connecting:
  ru: "подключение…"
  en: "connecting…"
  es: "conectando…"
status.live:
  ru: "онлайн"
  en: "live"
  es: "en vivo"
status.disconnected:
  ru: "отключено"
  en: "disconnected"
  es: "desconectado"
status.connected_count:
  ru: "подключено"
  en: "connected"
  es: "conectado"

# --- Тулбар ---
toolbar.size:
  ru: "Размер"
  en: "Size"
  es: "Tamaño"
toolbar.scale:
  ru: "Масштаб"
  en: "Scale"
  es: "Escala"
toolbar.scale_auto:
  ru: "Авто"
  en: "Auto"
  es: "Auto"
# «Live» — отраслевой термин, не переводим; глиф ▶ — отдельный segment.
toolbar.live:
  ru: "Live"
  en: "Live"
  es: "Live"
toolbar.pause:
  ru: "Пауза"
  en: "Pause"
  es: "Pausa"
toolbar.live_tip:
  ru: "Live: график бежит за рынком. Пауза: заморожен, можно листать (ЛКМ-перетаскивание, колесо)."
  en: "Live: the chart follows the market. Pause: frozen, you can scroll (LMB drag, wheel)."
  es: "Live: el gráfico sigue al mercado. Pausa: congelado, puedes desplazarte (arrastrar con clic izquierdo, rueda)."
toolbar.close_chart:
  ru: "Закрыть график"
  en: "Close chart"
  es: "Cerrar gráfico"
toolbar.reports:
  ru: "Отчёты"
  en: "Reports"
  es: "Informes"
toolbar.help:
  ru: "Справка"
  en: "Help"
  es: "Ayuda"
toolbar.strategies:
  ru: "Стратегии"
  en: "Strategies"
  es: "Estrategias"

# --- Чарт-вкладка / откреплённое чарт-окно ---
chartwin.tab_title:
  ru: "Чарт %{n}"
  en: "Chart %{n}"
  es: "Gráfico %{n}"
chartwin.clear:
  ru: "Закрыть окно (убрать все графики)"
  en: "Close window (remove all charts)"
  es: "Cerrar ventana (quitar todos los gráficos)"

# --- Попап настроек раскладки чарт-вкладки (FIT/SCROLL/COMPRESS + высота) ---
chart.layout.title:
  ru: "Раскладка вкладки"
  en: "Tab layout"
  es: "Disposición de pestaña"
chart.layout.height:
  ru: "Высота, px"
  en: "Height, px"
  es: "Altura, px"
chart.layout.tip:
  ru: "Настройки раскладки этой вкладки"
  en: "This tab's layout settings"
  es: "Ajustes de disposición de esta pestaña"
