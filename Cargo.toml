# Virtual workspace. Единственный бинарь — GPUI-оболочка moon-ui-gpui (`moon-gpui`)
# поверх UI-агностичного ядра moon-core; общий чарт-крейт moon-chart даёт математику/
# геометрию (view/axes/transform/build_order_geometry/инстанс-типы), wgpu-free.
#
# Старый egui-бинарь moon-terminal (корневой src/) удалён вместе с wgpu-движком и
# offscreen→readback — рисование переведено на own-pass DX11 (chartdx). См.
# docs/REFACTOR_RENDER.md.
[workspace]
members = ["crates/moon-core", "crates/moon-chart", "crates/moon-ui-gpui"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true

# Dev-сборка для GPUI-оболочки: главный источник рывков (вплоть до курсора) — DX12
# debug/validation-слой, который GPUI и wgpu включают в debug по `cfg!(debug_assertions)`
# (он же `HRESULT 0x887A002D` на старте без Graphics Tools). Отключаем его, не уходя в
# release: debug_assertions=false снимает оба слоя; зависимости (gpui/skia) собираем
# оптимизированно — рантайм близок к release, а инкрементальная сборка своего кода быстра.
[profile.dev]
debug-assertions = false

[profile.dev.package."*"]
opt-level = 3

# MoonKernel: единая GPUI база для public-сборки.
#
# Пока raw GPU-pass hook не принят upstream Zed, канонический источник GPUI для
# всего Moon-стека — Moonbot-Tech/ZedFork@f2f07f30692dcc1d3791acc454f4822ac81eaf9c. Терминал, MoonPalette и
# связанные GPUI-крейты должны смотреть на один fork commit, чтобы Cargo не
# собирал две несовместимые копии GPUI.
#
# Локальные path overrides живут только в ignored .cargo/config.toml.
[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/Moonbot-Tech/ZedFork", rev = "f2f07f30692dcc1d3791acc454f4822ac81eaf9c" }
gpui_platform = { git = "https://github.com/Moonbot-Tech/ZedFork", rev = "f2f07f30692dcc1d3791acc454f4822ac81eaf9c" }
gpui_windows = { git = "https://github.com/Moonbot-Tech/ZedFork", rev = "f2f07f30692dcc1d3791acc454f4822ac81eaf9c" }
gpui_macos = { git = "https://github.com/Moonbot-Tech/ZedFork", rev = "f2f07f30692dcc1d3791acc454f4822ac81eaf9c" }
gpui_linux = { git = "https://github.com/Moonbot-Tech/ZedFork", rev = "f2f07f30692dcc1d3791acc454f4822ac81eaf9c" }
gpui_web = { git = "https://github.com/Moonbot-Tech/ZedFork", rev = "f2f07f30692dcc1d3791acc454f4822ac81eaf9c" }
gpui_wgpu = { git = "https://github.com/Moonbot-Tech/ZedFork", rev = "f2f07f30692dcc1d3791acc454f4822ac81eaf9c" }
gpui_macros = { git = "https://github.com/Moonbot-Tech/ZedFork", rev = "f2f07f30692dcc1d3791acc454f4822ac81eaf9c" }
gpui_shared_string = { git = "https://github.com/Moonbot-Tech/ZedFork", rev = "f2f07f30692dcc1d3791acc454f4822ac81eaf9c" }
gpui_util = { git = "https://github.com/Moonbot-Tech/ZedFork", rev = "f2f07f30692dcc1d3791acc454f4822ac81eaf9c" }

# Zed's crates.io patches are not inherited transitively when GPUI is consumed as a dependency.
# Keep the GPUI process stack on the same patched crates the fork itself uses.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
